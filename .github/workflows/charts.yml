name: Atualizar gráficos do perfil

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia, 03h de Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar gráficos
        run: python .github/scripts/charts.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg assets/evolution.svg
          git diff --staged --quiet || git commit -m "chore: atualiza gráficos do perfil"
          git push
